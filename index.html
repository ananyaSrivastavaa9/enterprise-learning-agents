<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoso Agents League | Premium Portal</title>
    <style>
        /* Base Luxury Tech Styling Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            background: #000102; 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; 
            height: 100vh; width: 100vw;
        }

        /* ==========================================================
        🎬 HIGH-BUDGET SCIFI INTRO CINEMATIC VIEWPORT
        ========================================================== */
        .scifi-cold-open {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #071518 0%, #000204 100%);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; opacity: 1;
            transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }
        
        .ambient-fog {
            position: absolute; width: 150%; height: 150%;
            background: radial-gradient(circle at 50% 50%, rgba(123,240,255,0.08) 0%, transparent 60%);
            filter: blur(50px); pointer-events: none;
        }

        /* 3D Liquid Metal Chrome Droplet Keyframes */
        .liquid-droplet {
            position: absolute; top: -100px; width: 30px; height: 45px;
            background: linear-gradient(135deg, #ffffff, #a1a8b8, #475569);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset -3px -5px 10px rgba(0,0,0,0.8), 0 0 20px rgba(123,240,255,0.2);
            animation: dropFall 1.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes dropFall {
            0% { transform: translateY(0) scaleY(1.3); opacity: 0; }
            15% { opacity: 1; }
            90% { transform: translateY(42vh) scaleY(1); }
            100% { transform: translateY(45vh) scaleY(0.3) scaleX(1.6); opacity: 0; }
        }

        /* Shockwave Impact Ripple Generation */
        .energy-wave {
            position: absolute; top: 45vh; width: 150px; height: 40px;
            border: 2px solid #7bf0ff; border-radius: 50%; opacity: 0;
            animation: rippleExpand 1.4s cubic-bezier(0.1, 0.8, 0.3, 1) 1.7s forwards;
        }

        @keyframes rippleExpand {
            0% { transform: scale(0); opacity: 1; box-shadow: 0 0 10px #7bf0ff; }
            100% { transform: scale(3.5); opacity: 0; box-shadow: 0 0 40px transparent; }
        }

        /* Holographic Circuits Assembly Avatar */
        .ai-avatar-core {
            opacity: 0; transform: translateY(30px) scale(0.95);
            animation: assembleEntity 2.2s cubic-bezier(0.19, 1, 0.22, 1) 2.8s forwards;
            filter: drop-shadow(0 0 30px rgba(123,240,255,0.4));
            margin-bottom: 20px; z-index: 10;
        }

        @keyframes assembleEntity {
            0% { opacity: 0; filter: brightness(4) blur(8px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1) blur(0); }
        }

        /* Floating 3D Chrome Typography Branding */
        .brand-text {
            font-size: 3.4rem; font-weight: 800; letter-spacing: 4px;
            text-transform: uppercase; text-align: center; opacity: 0;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: assembleEntity 1.5s ease-out 4.2s forwards;
            margin-bottom: 40px; z-index: 10;
        }

        /* Glassmorphic Luxury Call-To-Action Layout */
        .premium-cta-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(123, 240, 255, 0.3);
            color: #7bf0ff; padding: 14px 48px; border-radius: 30px;
            font-size: 1.1rem; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; opacity: 0; z-index: 10;
            box-shadow: 0 0 25px rgba(123,240,255,0.1);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            animation: assembleEntity 1.2s ease-out 5.2s forwards;
        }

        .premium-cta-btn:hover {
            transform: translateY(-2px) scale(1.03);
            border-color: #ffffff; color: #ffffff;
            box-shadow: 0 0 35px rgba(123,240,255,0.4), inset 0 0 15px rgba(123,240,255,0.2);
        }

        /* ==========================================================
        ⚙️ INDUSTRIAL MULTI-AGENT COMPILER WORKSPACE (DASHBOARD)
        ========================================================== */
        .dashboard-container {
            width: 100%; max-width: 1300px; margin: 0 auto;
            padding: 40px 20px; display: grid;
            grid-template-columns: 65% 35%; gap: 30px; opacity: 0;
            transform: scale(0.99); transition: all 1s ease-out;
            height: 100vh; align-content: center;
        }

        .glass-window {
            background: rgba(11, 24, 28, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(123, 240, 255, 0.12);
            border-radius: 16px; padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .input-row {
            display: flex; gap: 15px; margin-top: 20px; margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(123,240,255,0.25); border-radius: 8px;
            padding: 14px 18px; color: #fff; font-size: 1rem; outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus { border-color: #7bf0ff; }

        .run-btn {
            background: #7bf0ff; color: #03070a; border: none;
            padding: 0 30px; border-radius: 8px; font-weight: 700;
            cursor: pointer; transition: background 0.3s;
        }

        .run-btn:hover { background: #ffffff; }

        .worker-pipeline {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
        }

        .agent-capsule {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; padding: 20px; text-align: center;
        }

        .log-stream-box {
            display: flex; flex-direction: column; gap: 10px;
            height: 250px; background: rgba(4,9,12,0.6);
            border-radius: 8px; padding: 15px; overflow-y: auto;
            border-left: 3px solid #7bf0ff; font-family: monospace; font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="scifi-cold-open" id="introViewport">
        <div class="ambient-fog"></div>
        <div class="liquid-droplet"></div>
        <div class="energy-wave"></div>
        
        <div class="ai-avatar-core">
            <svg width="150" height="150" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="40" r="22" stroke="#7bf0ff" stroke-width="1" stroke-dasharray="2 2"/>
                <path d="M35 40C35 28.9543 43.9543 20 50 20C56.0457 20 65 28.9543 65 40C65 46 59 52 50 52C41 52 35 46 35 40Z" fill="url(#metal)" stroke="#ffffff" stroke-width="1.5"/>
                <circle cx="43" cy="38" r="2.5" fill="#7bf0ff"/>
                <circle cx="57" cy="38" r="2.5" fill="#7bf0ff"/>
                <path d="M46 45Q50 48 54 45" stroke="#7bf0ff" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="brand-text">Contoso Agents League</div>
        <button class="premium-cta-btn" onclick="triggerPortalTransition()">Get Started</button>
    </div>

    <div class="dashboard-container" id="mainDashboard">
        <div class="glass-window">
            <span style="color:#7bf0ff; text-transform:uppercase; font-size:0.75rem; font-weight:600; letter-spacing:1px;">Intake Operations</span>
            <h2 style="margin-top:5px; font-weight:700;">Specify Employee Designation</h2>
            
            <div class="input-row">
                <input type="text" id="roleInput" placeholder="e.g., Cloud Infrastructure Engineer...">
                <button class="run-btn" onclick="executeChainSimulation()">Run Loop</button>
            </div>

            <div class="worker-pipeline">
                <div class="agent-capsule"><strong>🔍 Sage Auditor</strong><br><span style="color:#64748b; font-size:0.8rem;">Policy Layer</span></div>
                <div class="agent-capsule"><strong>📅 Chronos</strong><br><span style="color:#64748b; font-size:0.8rem;">Planner Layer</span></div>
                <div class="agent-capsule"><strong>💾 Codex</strong><br><span style="color:#64748b; font-size:0.8rem;">Memory Layer</span></div>
            </div>
        </div>

        <div class="glass-window" style="display: flex; flex-direction: column;">
            <h3 style="font-size:1.1rem; margin-bottom:15px;">Agent Insights Stream</h3>
            <div class="log-stream-box" id="logBox">
                <span style="color:#4b5a61;">Awaiting parameter initializations...</span>
            </div>
        </div>
    </div>

    <script>
        // Smooth layout transition sequence
        function triggerPortalTransition() {
            const intro = document.getElementById('introViewport');
            const dash = document.getElementById('mainDashboard');
            
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                dash.style.opacity = '1';
                dash.style.transform = 'scale(1)';
            }, 1200);
        }

        // Simulating the backend multi-agent loop output tracking logs
        function executeChainSimulation() {
            const val = document.getElementById('roleInput').value.strip;
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = '';

            const logs = [
                "⚡ [Supervisor]: Triggering parallel threads...",
                "🔍 [Sage Auditor]: Fetching indexes from data cloud...",
                "📅 [Chronos]: Structuring rules calendar matrices...",
                "💾 [Codex]: Compilation completed successfully."
            ];

            logs.forEach((msg, index) => {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.style.marginBottom = '8px';
                    el.innerText = msg;
                    logBox.appendChild(el);
                }, index * 600);
            });
        }
    </script>
</body>
</html>
